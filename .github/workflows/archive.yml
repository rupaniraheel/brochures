name: Download Octara PDFs

on:
  push:
    branches:
      - arena/01a04578-brochures

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download PDFs
        run: python download.py

      - name: Commit PDFs
        run: |
          git add pdfs PDFS.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive Octara PDF search results"
          git push
