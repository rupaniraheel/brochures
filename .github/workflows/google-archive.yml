name: Google Octara PDF Archive

on:
  push:
    branches:
      - arena/01a04578-brochures

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Search Google and download PDFs
        run: python download.py

      - name: Commit all downloaded PDFs
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive expanded Google PDF results" || exit 0
          git push
